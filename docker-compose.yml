version: "3.8"

services:
  zentroplay:
    build: .
    networks:
      - traefik-public
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"

        - "traefik.http.routers.zentroplay.rule=Host(`zentroplay.net`) || Host(`www.zentroplay.net`)"
        - "traefik.http.routers.zentroplay.entrypoints=web,websecure"

        - "traefik.http.routers.zentroplay.tls=true"
        - "traefik.http.routers.zentroplay.tls.certresolver=letsencrypt"

        - "traefik.http.services.zentroplay.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
